name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm run security:public
      - run: npm ci
      - run: npm test
      - name: CLI smoke test
        run: node dist/src/cli.js demo --policy examples/policy.json --ledger .tmp/reviewgate-demo.jsonl
